<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Links</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        h1 { color: #333; margin-bottom: 30px; }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 250px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none; /* Removes underline from link */
            color: inherit;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .card h2 {
            margin: 10px 0;
            font-size: 1.25rem;
            color: #007bff;
        }

        .card p {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>Useful Resources</h1>

    <div class="card-container">
        
        <a href="https://script.google.com/macros/s/AKfycbwe-cu_GEKuZUHroCAdrf0vU7W-KX8Xcqn2GWmlgIxk5KMOPQVT9jYukUER0hZb3V7J/exec" target="_blank" class="card">
            <h2>CNP</h2>
            <p>The world's most popular search engine.</p>
        </a>

        <a href="https://www.github.com" target="_blank" class="card">
            <h2>GitHub</h2>
            <p>Where the world builds software and hosts code.</p>
        </a>

        <a href="https://www.wikipedia.org" target="_blank" class="card">
            <h2>Wikipedia</h2>
            <p>The free encyclopedia that anyone can edit.</p>
        </a>

        <a href="https://www.canva.com" target="_blank" class="card">
            <h2>Canva</h2>
            <p>Easy-to-use graphic design tool for everyone.</p>
        </a>

    </div>

</body>
</html>
